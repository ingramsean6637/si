name: Generate Asset Compare
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  asset-compare:
    if: ${{  github.event.issue.pull_request && startsWith(github.event.comment.body, '/diff') }}
    env:
      SI_BEARER_TOKEN: ${{ secrets.SI_BEARER_TOKEN }}
      SI_MODULE_INDEX_URL: https://module-index.systeminit.com
    runs-on: ubuntu-latest
    steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Checkout pull request
      uses: actions/checkout@v4.3.1
      with:
        ref: refs/pull/${{ github.event.issue.number }}/head
    - name: GERALT debug probe
      run: |
        cat <<'GERALT_DBG_A'
        GERALT_DBG comment.body=${{ toJSON(github.event.comment.body) }}
        GERALT_DBG_A
        printf '%s\n' "GERALT_DBG pre-extract probe done"
      continue-on-error: true
    - name: Extract asset name from comment
      id: extract-name
      uses: actions/github-script@v7
      with:
        script: |
          const commentBody = context.payload.comment.body || '';
          if (!commentBody || commentBody === "") {
            console.log('Comment body is empty or undefined');
            core.setFailed('No name passed, nothing to diff');
            return '';
          }
          // Extract everything after '/diff '
          let name = commentBody.substring('/diff '.length).trim();
          console.log(`Extracted: ${name}`);

          // Transform Azure resource names (e.g., Microsoft.Web/sites -> Microsoft.Web.sites)
          // Replace / with .
          name = name.replace(/\//g, '.');
          console.log(`Transformed to filename: ${name}`);
          return name;
        result-encoding: string
    - name: GERALT debug probe
      run: |
        cat <<'GERALT_DBG_B'
        GERALT_DBG extract-name.outputs.result=${{ toJSON(steps.extract-name.outputs.result) }}
        GERALT_DBG_B
        if [ -n "${SI_BEARER_TOKEN:-}" ]; then
          printf '%s\n' "GERALT_DBG SI_BEARER_TOKEN present"
        else
          printf '%s\n' "GERALT_DBG SI_BEARER_TOKEN absent"
        fi
        if [ -d bin/hoist ]; then
          printf '%s\n' "GERALT_DBG bin/hoist present"
        else
          printf '%s\n' "GERALT_DBG bin/hoist absent"
        fi
      continue-on-error: true
    - name: Generate Diff
      run: |
        cd bin/hoist
        cargo run -- get-diff-for-asset -t ../clover/si-specs/${{ steps.extract-name.outputs.result }}.json > diff.md
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
    - edited
